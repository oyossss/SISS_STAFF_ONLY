{% extends "base.html" %}
{% block head %}
<!--<link rel="stylesheet" href="{{ url_for('static', filename='css/mypage.css') }}">--> 
{% endblock %}

{% block content %}
<div class="mypage-container">
  <h2>My Page</h2>

  <div class="ticket-section">
    <h3>My Ticket</h3>
    {% if ticket %}
      <div class="ticket-card">
        <p><strong>Seat:</strong> {{ ticket['seat_code'] }}</p>
      </div>
    {% else %}
      <p>No tickets purchased.</p>
    {% endif %}
  </div>

  {% if staff_code %}
    <input type="text" id="staff_code" value="{{ staff_code }}">
  {% endif %}

  {% if msg %}
    <div class="msg">{{ msg }}</div>
  {% endif %}
</div>
{% endblock %}
